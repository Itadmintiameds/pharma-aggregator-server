spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/pharma-aggregator
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  mail:   # Email configuration
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true



#  # Twilio sms
#twilio:
#  account-sid: ${ACCOUNT_SID}
#  auth-token: ${AUTH_TOKEN}
#  verify:
#    service-sid: ${SERVICE_SID}

twilio:
  account-sid: ${ACCOUNT_SID:dummy_sid}
  auth-token: ${AUTH_TOKEN:dummy_token}
  verify:
    service-sid: ${SERVICE_SID:dummy_service}



springdoc:
  swagger-ui:
    enabled: true
    try-it-out-enabled: true


logging:
  level:
    org.springframework.mail: DEBUG
    jakarta.mail: DEBUG
