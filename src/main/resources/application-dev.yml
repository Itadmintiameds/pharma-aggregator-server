server:
  servlet:
    context-path: /api/v1
  error:
    include-message: always
    include-binding-errors: always
    include-exception: true
    include-stacktrace: always

app:
  login-url: http://localhost:3000/reset-password
  frontend-url: http://localhost:3000
  admin-frontend-url: http://localhost:3000
  reset-token-expiration-hours: 1
  jwt:
    secret: mySecretKeyForJWTTokenGenerationAndValidation2024!@#$%^&*
    expiration: 86400000


spring:

  main:
    allow-bean-definition-overriding: true

  datasource:
    url: ${POSTGRES_URL}
    username: postgres
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  mail:   # Email configuration
    host: smtp.gmail.com
    port: 587
    username: basavarajunn@tiameds.ai
    password: ovfx kzmu ikhg rily
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true


  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB


