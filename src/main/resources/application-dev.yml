springdoc:
  swagger-ui:
    enabled: true
    try-it-out-enabled: true


logging:
  level:
    org.springframework.mail: DEBUG
    jakarta.mail: DEBUG

    org.springframework.web: DEBUG

    org.springframework.security: DEBUG

    org.hibernate.SQL: DEBUG
