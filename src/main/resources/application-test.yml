spring:
  datasource:
    url: jdbc:postgresql://${HOST}:${PORT}/${DATABASE}?charSet=UTF8
    username:  ${USERNAME}
    password: ${PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

springdoc:
  swagger-ui:
    enabled: true
    try-it-out-enabled: true


