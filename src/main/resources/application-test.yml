server:
  servlet:
    context-path: /api/v1

spring:
  datasource:

    url: jdbc:postgresql://${DB_URL}:${DB_PORT}/${DB_NAME}?characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  mail: # Email configuration
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  # Twilio sms
twilio:
  account-sid: AC35ec54287b2863257cb5acbdffa10fe0
  auth-token: 3722f073c825a203a5119fc912869ec9
  verify:
    service-sid: VA12037d4ce3dc3ae5e66c1f9efbfcc508

springdoc:
  swagger-ui:
    enabled: true
    try-it-out-enabled: true


